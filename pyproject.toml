[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-bigdata-analysis"
version = "0.1.0"
description = "E-commerce customer behaviour and sales analysis using Python and big-data techniques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3,<3.0",
    "openpyxl>=3.1.5,<4.0",
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]
bigdata = [
    "pyspark>=4.2,<4.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
